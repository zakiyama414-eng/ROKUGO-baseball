<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13243d">
<title>六郷高校 Baseball Analyzer v5.1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f9;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;padding-bottom:90px}
header{background:#13243d;color:#fff;padding:34px 20px 25px}header h1{margin:0 0 8px;font-size:28px}header p{margin:0;color:#cbd5e1;font-size:16px}
main{max-width:1100px;margin:auto;padding:16px}.page{display:none}.page.active{display:block}.card{background:#fff;border-radius:22px;padding:20px;margin-bottom:16px;box-shadow:0 3px 16px #0000000c}
h2{margin:0 0 18px;font-size:23px}.grid,.resultgrid,.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-size:13px;font-weight:700;color:#667085;margin-bottom:6px}
input,select{width:100%;height:52px;border:2px solid #d9e0e9;border-radius:15px;background:#fff;padding:0 12px;font-size:17px}
.result{height:72px;border:2px solid #d9e0e9;border-radius:16px;background:#f7f9fb;color:#0786f9;font-size:20px;font-weight:800}
.stats .box{background:#f5f7fa;border-radius:16px;padding:14px}.box b{display:block;font-size:25px;margin-top:4px}
table{width:100%;border-collapse:collapse}th,td{padding:10px 6px;border-bottom:1px solid #e5e7eb;text-align:center}
.notice{background:#eef6ff;padding:13px;border-radius:14px;color:#24527a}.live{margin-top:16px;font-weight:800}
.bottom{position:fixed;z-index:20;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dbe1e8;display:grid;grid-template-columns:repeat(4,1fr);padding:7px 6px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px #00000012}
.nav{border:0;background:none;color:#667085;font-weight:700;font-size:12px}.nav span{display:block;font-size:23px}.nav.active{color:#0786f9}
.danger{padding:12px 16px;border:1px solid #d9aaaa;border-radius:13px;background:#fff0f0;color:#b42318;font-weight:700}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.resultgrid{grid-template-columns:repeat(3,1fr)}.stats{grid-template-columns:repeat(4,1fr)}main{padding:25px}}
</style>
</head>
<body>
<header><h1>⚾ 六郷高校 Baseball Analyzer</h1><p>試合入力・集計・統計・攻撃作戦の実戦効果</p></header>
<main>
<section id="input" class="page active">
<div class="card"><h2>試合・選手</h2><div class="grid">
<div><label>試合</label><input id="game" value="練習試合"></div>
<div><label>対戦校</label><input id="opponent" placeholder="対戦校名"></div>
<div><label>打者</label><input id="player" value="選手1"></div>
<div><label>打順</label><select><option>1番</option><option>2番</option><option>3番</option><option>4番</option><option>5番</option><option>6番</option><option>7番</option><option>8番</option><option>9番</option></select></div>
</div></div>
<div class="card"><h2>試合状況</h2><div class="grid">
<div><label>回</label><select><option>1回</option><option>2回</option><option>3回</option><option>4回</option><option>5回</option><option>6回</option><option>7回</option><option>8回</option><option>9回</option></select></div>
<div><label>走者</label><select><option>走者なし</option><option>一塁</option><option>二塁</option><option>三塁</option><option>一・二塁</option><option>満塁</option></select></div>
<div><label>カウント</label><select><option>0-0</option><option>1-0</option><option>0-1</option><option>1-1</option><option>2-1</option><option>2-2</option><option>3-2</option></select></div>
<div><label>投手</label><select><option>右投手</option><option>左投手</option></select></div>
</div></div>
<div class="card"><h2>打席結果</h2><div class="resultgrid">
<button class="result" onclick="add('単打',1)">単打</button><button class="result" onclick="add('二塁打',1)">二塁打</button>
<button class="result" onclick="add('三塁打',1)">三塁打</button><button class="result" onclick="add('本塁打',1)">本塁打</button>
<button class="result" onclick="add('四球',0)">四球</button><button class="result" onclick="add('死球',0)">死球</button>
<button class="result" onclick="add('三振',0)">三振</button><button class="result" onclick="add('凡打',0)">凡打</button>
<button class="result" onclick="add('犠打',0)">犠打</button>
</div><div id="live" class="live">LIVE　まだ記録がありません</div></div>
</section>

<section id="summary" class="page"><div class="card"><h2>📋 集計</h2><div class="stats">
<div class="box">打席<b id="pa">0</b></div><div class="box">安打<b id="hits">0</b></div>
<div class="box">打率<b id="avg">.000</b></div><div class="box">出塁率<b id="obp">.000</b></div>
<div class="box">長打率<b id="slg">.000</b></div><div class="box">OPS<b id="ops">.000</b></div>
<div class="box">連打率<b id="streak">0.0%</b></div><div class="box">作戦成功率<b>0.0%</b></div>
</div></div><div class="card"><h3>打撃結果</h3><table><thead><tr><th>結果</th><th>回数</th></tr></thead><tbody id="table"></tbody></table></div></section>

<section id="stats" class="page"><div class="card"><h2>📊 統計</h2><div class="notice">入力データからリアルタイムで統計を表示します。</div><div class="stats" style="margin-top:14px">
<div class="box">最多結果<b id="top">---</b></div><div class="box">被連打率<b>0.0%</b></div>
<div class="box">攻撃作戦数<b>0</b></div><div class="box">作戦成功<b>0</b></div>
</div></div><div class="card"><h3>選手別成績</h3><table><thead><tr><th>選手</th><th>打席</th><th>安打</th><th>打率</th></tr></thead><tbody id="players"></tbody></table></div></section>

<section id="settings" class="page"><div class="card"><h2>⚙️ 設定</h2><p>六郷高校 Baseball Analyzer v5.1</p><button class="danger" onclick="resetData()">記録をリセット</button></div></section>
</main>
<nav class="bottom">
<button class="nav active" onclick="page('input',this)"><span>📝</span>入力</button>
<button class="nav" onclick="page('summary',this)"><span>📋</span>集計</button>
<button class="nav" onclick="page('stats',this)"><span>📊</span>統計</button>
<button class="nav" onclick="page('settings',this)"><span>⚙️</span>設定</button>
</nav>
<script>
let data=JSON.parse(localStorage.getItem('rokugo_v51')||'[]');
function $(x){return document.getElementById(x)}
function add(result,hit){data.push({player:$('player').value||'選手1',result,hit});localStorage.setItem('rokugo_v51',JSON.stringify(data));$('live').textContent='LIVE　'+result+'を記録しました';update()}
function page(id,b){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));b.classList.add('active');scrollTo(0,0);update()}
function fmt(n){return n.toFixed(3).replace(/^0/,'')}
function update(){
let pa=data.length,h=data.filter(x=>x.hit).length,ab=data.filter(x=>!['四球','死球','犠打'].includes(x.result)).length;
let obp=pa?(h+data.filter(x=>['四球','死球'].includes(x.result)).length)/pa:0,bases=data.reduce((s,x)=>s+({単打:1,二塁打:2,三塁打:3,本塁打:4}[x.result]||0),0),slg=ab?bases/ab:0;
$('pa').textContent=pa;$('hits').textContent=h;$('avg').textContent=fmt(ab?h/ab:0);$('obp').textContent=fmt(obp);$('slg').textContent=fmt(slg);$('ops').textContent=fmt(obp+slg);
let c={};data.forEach(x=>c[x.result]=(c[x.result]||0)+1);$('table').innerHTML=Object.entries(c).map(x=>'<tr><td>'+x[0]+'</td><td>'+x[1]+'</td></tr>').join('')||'<tr><td colspan="2">記録なし</td></tr>';let top=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];$('top').textContent=top?top[0]:'---';
let p={};data.forEach(x=>{p[x.player]??={pa:0,h:0,ab:0};p[x.player].pa++;p[x.player].h+=x.hit;p[x.player].ab+=!['四球','死球','犠打'].includes(x.result)});$('players').innerHTML=Object.entries(p).map(x=>'<tr><td>'+x[0]+'</td><td>'+x[1].pa+'</td><td>'+x[1].h+'</td><td>'+fmt(x[1].ab?x[1].h/x[1].ab:0)+'</td></tr>').join('')||'<tr><td colspan="4">記録なし</td></tr>';
}
function resetData(){if(confirm('記録をすべて削除しますか？')){data=[];localStorage.removeItem('rokugo_v51');update()}}
update();
</script>
</body></html>
